# Full method on ConvNeXt-Tiny + inter-camera color jitter (hypothesis #1 mitigation).
# Sonnet audit recommended per-batch color jitter as a cheap RandStainNA stand-in to
# expose the model to inter-camera variation during training. Confirmed via diagnostic
# (scripts/diagnostic_preprocess_shift.py) that APTOS and Messidor2 preprocessed images
# differ by:
#   - R channel mean: +0.045 (Messidor2 redder)
#   - Laplacian var ratio: 1.24x (Messidor2 sharper)
# So the camera-variation signal at training time is a real gap to close.
#
# Differences from full_method_convnext.yaml:
#   - camera_jitter: true in Phase 2 (backbone fine-tune) and Phase 3 (APTOS fine-tune)
#   - Phase 1 (frozen head warmup) keeps camera_jitter OFF — clean head init first
#   - Channel std: 0.08 (8% per-channel multiplicative jitter) — modest, not aggressive
#   - Gamma range: 0.85-1.15 — covers illumination-intensity variation across cameras
#   - sqrt-frequency sampler: kept (proven +0.0094 APTOS QWK in earlier eval)

run_name: "full_method_convnext_colorjitter"
checkpoint_dir: "saved/checkpoints"
log_dir: "saved/logs"
ema_decay: 0.999

loss_type: "corn"
use_class_weighting: true
use_mixup: true

model:
  arch: "convnext_tiny"
  pretrained: true
  use_cbam: true
  cbam_num_stages: 2
  num_thresholds: 4
  head_hidden_dim: 512
  dropout: 0.4
  channels_last: true   # ConvNeXt depthwise convs benefit from channels_last memory format
  # in_chans: 4        # Uncomment to enable Option A segmentation (4th channel = vessel mask)
  # seg_dir: "data/processed/segmentation/eyepacs"  # set per-phase below

phases:
  phase1_frozen:
    manifest_train: "data/splits/eyepacs_train.csv"
    manifest_val: "data/splits/eyepacs_val.csv"
    freeze_backbone: true
    aug_strength: "light"
    batch_size: 96      # probed on 12GB: bs=96 = 9.22 GB peak; bs=128 OOM
    num_epochs: 5
    head_lr: 0.001
    warmup_epochs: 1
    scheduler: "cosine"
    img_size: 384

  phase2_full_training:
    manifest_train: "data/splits/eyepacs_train.csv"
    manifest_val: "data/splits/eyepacs_val.csv"
    freeze_backbone: false
    aug_strength: "light"
    batch_size: 48
    num_epochs: 35
    head_lr: 0.000122        # sqrt-scaled from 1e-4 at bs=32 -> bs=48
    backbone_lr: 0.0000122   # sqrt-scaled from 1e-5
    weight_decay: 0.01
    warmup_epochs: 2
    scheduler: "cosine"
    min_epochs: 10
    overfitting_patience: 10
    img_size: 384
    use_sqrt_sampler: true   # sqrt-frequency WeightedRandomSampler — gives Mild/Moderate
                             # more draw probability per epoch so they get actual gradient
                             # signal. Stacks with CORN's per-threshold inverse_sqrt loss
                             # weights (different problem: exposure vs. magnitude).
    camera_jitter: true      # INTER-CAMERA color jitter ON for Phase 2 — backbone
                             # is the one that needs to learn domain-invariant
                             # features. Per-channel 8% gain + 0.85-1.15 gamma.
    camera_jitter_channel_std: 0.08
    camera_jitter_gamma_range: [0.85, 1.15]

  phase3_aptos:
    manifest_train: "data/splits/aptos_train.csv"
    manifest_val: "data/splits/aptos_val.csv"
    freeze_backbone: false        # full fine-tune — APTOS distribution differs from EyePACS
                                  # enough that backbone adaptation matters here.
                                  # OLD working config (full_method_best.pt, Messidor2 QWK=0.61)
                                  # used freeze_backbone:false here. The current
                                  # freeze_backbone_only:true froze the backbone entirely
                                  # and dropped APTOS QWK by ~0.07 and Messidor2 QWK by ~0.16.
    aug_strength: "heavy"
    batch_size: 32
    num_epochs: 20
    head_lr: 0.0001
    backbone_lr: 0.000001        # very small backbone LR — gentle adaptation, not catastrophic forgetting
    warmup_epochs: 1
    scheduler: "plateau"
    overfitting_patience: 0
    img_size: 384
    use_sqrt_sampler: true   # APTOS has Severe=5%, Proliferative=8% — same Mild starvation
                             # problem as EyePACS but in a smaller dataset, so the effect is
                             # even more pronounced. Sampler helps here.
    camera_jitter: true      # Keep jitter ON through APTOS fine-tune — the camera
                             # generalization is most important at the cross-domain
                             # boundary (Phase 3 -> Messidor2 zero-shot).
