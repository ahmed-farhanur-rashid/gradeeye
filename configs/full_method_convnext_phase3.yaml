# Phase 3 only — APTOS fine-tune starting from a Phase 2 best checkpoint.
# Used when Phase 2 is interrupted and we want to skip directly to Phase 3.
# Use with --resume pointing at the Phase 2 best checkpoint.
#
# Usage:
#   python scripts/train.py --config configs/full_method_convnext_phase3.yaml \
#     --resume saved/checkpoints/full_method_convnext_best.pt

run_name: "full_method_convnext"
checkpoint_dir: "saved/checkpoints"
log_dir: "saved/logs"
ema_decay: 0.999

loss_type: "corn"
use_class_weighting: true
use_mixup: true

model:
  arch: "convnext_tiny"
  pretrained: true
  use_cbam: true
  cbam_num_stages: 2
  num_thresholds: 4
  head_hidden_dim: 512
  dropout: 0.4
  channels_last: true
  img_size: 384

phases:
  phase3_aptos:
    manifest_train: "data/splits/aptos_train.csv"
    manifest_val: "data/splits/aptos_val.csv"
    freeze_backbone_only: true
    aug_strength: "heavy"
    batch_size: 32
    num_epochs: 20
    head_lr: 0.0001
    backbone_lr: 0.0
    warmup_epochs: 1
    scheduler: "plateau"
    overfitting_patience: 0
