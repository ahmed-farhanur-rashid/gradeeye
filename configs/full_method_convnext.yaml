# Full method on ConvNeXt-Tiny backbone.
# CORN ordinal loss + CBAM (last 2 stages) + per-threshold class weighting + MixUp.
# Renamed from full_method.yaml; behavior equivalent to original full method.

run_name: "full_method_convnext"
checkpoint_dir: "saved/checkpoints"
log_dir: "saved/logs"
ema_decay: 0.999

loss_type: "corn"
use_class_weighting: true
use_mixup: true

model:
  arch: "convnext_tiny"
  pretrained: true
  use_cbam: true
  cbam_num_stages: 2
  num_thresholds: 4
  head_hidden_dim: 512
  dropout: 0.4
  channels_last: true   # ConvNeXt depthwise convs benefit from channels_last memory format
  # in_chans: 4        # Uncomment to enable Option A segmentation (4th channel = vessel mask)
  # seg_dir: "data/processed/segmentation/eyepacs"  # set per-phase below

phases:
  phase1_frozen:
    manifest_train: "data/splits/eyepacs_train.csv"
    manifest_val: "data/splits/eyepacs_val.csv"
    freeze_backbone: true
    aug_strength: "light"
    batch_size: 96      # probed on 12GB: bs=96 = 9.22 GB peak; bs=128 OOM
    num_epochs: 5
    head_lr: 0.001
    warmup_epochs: 1
    scheduler: "cosine"
    img_size: 384

  phase2_full_training:
    manifest_train: "data/splits/eyepacs_train.csv"
    manifest_val: "data/splits/eyepacs_val.csv"
    freeze_backbone: false
    aug_strength: "light"
    batch_size: 48
    num_epochs: 35
    head_lr: 0.000122        # sqrt-scaled from 1e-4 at bs=32 -> bs=48
    backbone_lr: 0.0000122   # sqrt-scaled from 1e-5
    weight_decay: 0.01
    warmup_epochs: 2
    scheduler: "cosine"
    min_epochs: 10
    overfitting_patience: 10
    img_size: 384
    use_sqrt_sampler: true   # sqrt-frequency WeightedRandomSampler — gives Mild/Moderate
                             # more draw probability per epoch so they get actual gradient
                             # signal. Stacks with CORN's per-threshold inverse_sqrt loss
                             # weights (different problem: exposure vs. magnitude).

  phase3_aptos:
    manifest_train: "data/splits/aptos_train.csv"
    manifest_val: "data/splits/aptos_val.csv"
    freeze_backbone: false        # full fine-tune — APTOS distribution differs from EyePACS
                                  # enough that backbone adaptation matters here.
                                  # OLD working config (full_method_best.pt, Messidor2 QWK=0.61)
                                  # used freeze_backbone:false here. The current
                                  # freeze_backbone_only:true froze the backbone entirely
                                  # and dropped APTOS QWK by ~0.07 and Messidor2 QWK by ~0.16.
    aug_strength: "heavy"
    batch_size: 32
    num_epochs: 20
    head_lr: 0.0001
    backbone_lr: 0.000001        # very small backbone LR — gentle adaptation, not catastrophic forgetting
    warmup_epochs: 1
    scheduler: "plateau"
    overfitting_patience: 0
    img_size: 384
    use_sqrt_sampler: true   # APTOS has Severe=5%, Proliferative=8% — same Mild starvation
                             # problem as EyePACS but in a smaller dataset, so the effect is
                             # even more pronounced. Sampler helps here.
