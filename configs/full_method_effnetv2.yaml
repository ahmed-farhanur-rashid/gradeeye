# Full method on EfficientNetV2-S backbone.
# Same 3-phase training pipeline as full_method_convnext.yaml + camera color
# jitter (hypothesis #1 mitigation, per Sonnet audit). Built as a third
# architecture for ensemble diversity — EffNetV2-S uses MBConv blocks (BN-
# heavy) which is genuinely different from ConvNeXt's depthwise LayerNorm
# blocks, so an ensemble of ConvNeXt-T + EffNetV2-S + (future SwinV2-T)
# should be architecturally diverse.
#
# Memory: EfficientNetV2-S @ 384: bs=48 Phase 2 worked on a 12GB RTX 4070
# Super in spot-checks. If OOM, drop to bs=32 (Phase 1) and bs=24 (Phase 2).
# Phase 3 bs=24 for safety.
#
# Status: BUILT, NOT YET LAUNCHED. Requires explicit invocation.

run_name: "full_method_effnetv2"
checkpoint_dir: "saved/checkpoints"
log_dir: "saved/logs"
ema_decay: 0.999

loss_type: "corn"
use_class_weighting: true
use_mixup: true

model:
  arch: "efficientnetv2_s"
  pretrained: true
  use_cbam: true
  cbam_num_stages: 2
  num_thresholds: 4
  head_hidden_dim: 512
  dropout: 0.4
  channels_last: false   # BN-heavy; standard contiguous
  # in_chans: 4           # for Option A segmentation

phases:
  phase1_frozen:
    manifest_train: "data/splits/eyepacs_train.csv"
    manifest_val: "data/splits/eyepacs_val.csv"
    freeze_backbone: true
    aug_strength: "light"
    batch_size: 64       # Conservative; EffNetV2-S @ 384 bs=64 ~= 7-8 GB peak
    num_epochs: 5
    head_lr: 0.001
    warmup_epochs: 1
    scheduler: "cosine"
    img_size: 384

  phase2_full_training:
    manifest_train: "data/splits/eyepacs_train.csv"
    manifest_val: "data/splits/eyepacs_val.csv"
    freeze_backbone: false
    aug_strength: "light"
    batch_size: 32       # Conservative for EffNetV2-S full fine-tune @ 384
    num_epochs: 35
    head_lr: 0.000122
    backbone_lr: 0.0000122
    weight_decay: 0.01
    warmup_epochs: 2
    scheduler: "cosine"
    min_epochs: 10
    overfitting_patience: 10
    img_size: 384
    use_sqrt_sampler: true
    camera_jitter: true
    camera_jitter_channel_std: 0.08
    camera_jitter_gamma_range: [0.85, 1.15]

  phase3_aptos:
    manifest_train: "data/splits/aptos_train.csv"
    manifest_val: "data/splits/aptos_val.csv"
    freeze_backbone: false
    aug_strength: "heavy"
    batch_size: 24
    num_epochs: 20
    head_lr: 0.0001
    backbone_lr: 0.000001
    warmup_epochs: 1
    scheduler: "plateau"
    overfitting_patience: 0
    img_size: 384
    use_sqrt_sampler: true
    camera_jitter: true
    camera_jitter_channel_std: 0.08
    camera_jitter_gamma_range: [0.85, 1.15]