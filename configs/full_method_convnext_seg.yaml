# Full method on ConvNeXt-Tiny + Option A segmentation (vessel mask as 4th
# channel). Identical to full_method_convnext.yaml except `model.in_chans=4`
# and `phase.*.seg_dir` point at the pre-computed masks directory.

# IMPORTANT: Before running this config, generate masks first:
#   python scripts/precompute_seg_masks.py --datasets eyepacs aptos messidor2
#
# That writes masks to data/processed/segmentation/{eyepacs,aptos,messidor2}/.
# If masks are missing the dataset falls back to zeros for that image, which
# silently degrades performance — always run precompute first.

run_name: "full_method_convnext_seg"
checkpoint_dir: "saved/checkpoints"
log_dir: "saved/logs"
ema_decay: 0.999

loss_type: "corn"
use_class_weighting: true
use_mixup: true

model:
  arch: "convnext_tiny"
  pretrained: true
  use_cbam: true
  cbam_num_stages: 2
  num_thresholds: 4
  head_hidden_dim: 512
  dropout: 0.4
  channels_last: true
  in_chans: 4           # 3 RGB + 1 vessel mask

phases:
  phase1_frozen:
    manifest_train: "data/splits/eyepacs_train.csv"
    manifest_val: "data/splits/eyepacs_val.csv"
    seg_dir: "data/processed/segmentation/eyepacs"
    freeze_backbone: true
    aug_strength: "light"
    batch_size: 96      # probed on 12GB: bs=96 = 9.22 GB peak; bs=128 OOM
    num_epochs: 5
    head_lr: 0.001
    warmup_epochs: 1
    scheduler: "cosine"

  phase2_full_training:
    manifest_train: "data/splits/eyepacs_train.csv"
    manifest_val: "data/splits/eyepacs_val.csv"
    seg_dir: "data/processed/segmentation/eyepacs"
    freeze_backbone: false
    aug_strength: "light"
    batch_size: 48
    num_epochs: 35
    head_lr: 0.000122
    backbone_lr: 0.0000122
    weight_decay: 0.01
    warmup_epochs: 2
    scheduler: "cosine"
    min_epochs: 10
    overfitting_patience: 10

  phase3_aptos:
    manifest_train: "data/splits/aptos_train.csv"
    manifest_val: "data/splits/aptos_val.csv"
    seg_dir: "data/processed/segmentation/aptos"
    freeze_backbone_only: true
    aug_strength: "heavy"
    batch_size: 32
    num_epochs: 20
    head_lr: 0.0001
    backbone_lr: 0.0
    warmup_epochs: 1
    scheduler: "plateau"
    overfitting_patience: 0