# Full method on ConvNeXt-Tiny, multi-domain (EyePACS + APTOS + Messidor2
# combined) training, single-stage 2-phase pipeline.
#
# Differences from full_method_convnext.yaml:
#   - 3-phase (EyePACS frozen -> EyePACS full -> APTOS fine-tune) collapsed
#     to 2-phase (combined frozen head -> combined full fine-tune).
#   - Phase 1 manifest: combined_train.csv (~75k samples from all 3 sources)
#   - Phase 1 validation: combined val (eyepacs_val+aptos_val+messidor2_val)
#   - Phase 2 same as Phase 1 but full fine-tune
#   - sqrt-frequency sampler: enabled Phase 2 (same proven benefit as before)
#   - overfitting_patience: 7 (tighter than 10; more diverse data means
#     shorter natural plateau)
#   - min_epochs: 8
#   - in_chans: 4 + per-phase seg_dir to enable 4-channel segmentation mode.
#     Set in_chans: 3 + remove seg_dir to disable segmentation (segmentation
#     is a configurable knob, not hardwired).
#   - NO Phase 3 APTOS fine-tune — when APTOS is already in the combined
#     pretraining mix, a separate Phase 3 was found unnecessary and prone to
#     overfitting on the smaller APTOS subset.

run_name: "full_method_multidomain"
checkpoint_dir: "saved/checkpoints"
log_dir: "saved/logs"
ema_decay: 0.999

loss_type: "corn"
use_class_weighting: true
use_mixup: true

model:
  arch: "convnext_tiny"
  pretrained: true
  use_cbam: true
  cbam_num_stages: 2
  num_thresholds: 4
  head_hidden_dim: 512
  dropout: 0.4
  channels_last: true
  in_chans: 4            # 4 channels: 3 RGB + 1 pretrained U-Net
                         # segmentation mask (DRIVE vessels + IDRiD lesions).
                         # Set to 3 to disable segmentation.
  # seg_dir: <path>     # set per-phase below to enable 4-channel mode.

phases:
  phase1_frozen:
    manifest_train: "data/splits/combined_train.csv"
    manifest_val: "data/splits/combined_val.csv"
    seg_dir: "data/processed/segmentation_combined"  # see note in MODEL section
    freeze_backbone: true
    aug_strength: "light"
    batch_size: 64        # 4-channel is ~28% more memory than 3-channel; reduced from 96
    num_epochs: 5
    head_lr: 0.001
    warmup_epochs: 1
    scheduler: "cosine"
    img_size: 384
    use_sqrt_sampler: false  # Phase 1 is head warmup — keep clean

  phase2_full_training:
    manifest_train: "data/splits/combined_train.csv"
    manifest_val: "data/splits/combined_val.csv"
    seg_dir: "data/processed/segmentation_combined"  # see note in MODEL section
    freeze_backbone: false
    aug_strength: "light"
    batch_size: 24        # 4-channel backprop larger; reduced from 32
    num_epochs: 35
    head_lr: 0.000122
    backbone_lr: 0.0000122
    weight_decay: 0.01
    warmup_epochs: 2
    scheduler: "cosine"
    min_epochs: 8
    overfitting_patience: 7
    img_size: 384
    use_sqrt_sampler: true