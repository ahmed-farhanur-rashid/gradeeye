arch: deit3_small_patch16_384
checkpoint_dir: saved/checkpoints
log_dir: saved/logs
ema_decay: 0.999
loss_type: corn
use_class_weighting: true
use_mixup: true
model:
  arch: deit3_small_patch16_384
  pretrained: true
  use_cbam: true
  cbam_num_stages: 2
  num_thresholds: 4
  head_hidden_dim: 384
  dropout: 0.3
  channels_last: false
  in_chans: 3
  img_size: 384
phases:
  phase1_frozen:
    freeze_backbone: true
    aug_strength: light
    batch_size: 64
    num_epochs: 5
    head_lr: 0.001
    warmup_epochs: 1
    scheduler: cosine
    img_size: 384
    use_sqrt_sampler: false
  phase2_full_training:
    freeze_backbone: false
    aug_strength: light
    batch_size: 16
    num_epochs: 35
    head_lr: 5.0e-05
    backbone_lr: 5.0e-06
    weight_decay: 0.01
    warmup_epochs: 2
    scheduler: cosine
    min_epochs: 8
    overfitting_patience: 7
    img_size: 384
    use_sqrt_sampler: true
