arch: convnext_tiny
checkpoint_dir: saved/checkpoints
ema_decay: 0.999
log_dir: saved/logs
loss_type: corn
model:
  arch: convnext_tiny
  cbam_num_stages: 2
  channels_last: true
  dropout: 0.4
  head_hidden_dim: 512
  img_size: 384
  in_chans: 3
  num_thresholds: 4
  pretrained: true
  use_cbam: true
phases:
  phase1_frozen:
    aug_strength: light
    batch_size: 64
    freeze_backbone: true
    head_lr: 0.001
    img_size: 384
    num_epochs: 5
    scheduler: cosine
    use_sqrt_sampler: false
    warmup_epochs: 1
  phase2_full_training:
    aug_strength: light
    backbone_lr: 1.22e-05
    batch_size: 24
    freeze_backbone: false
    head_lr: 0.000122
    img_size: 384
    min_epochs: 8
    num_epochs: 20
    overfitting_patience: 5
    scheduler: cosine
    use_sqrt_sampler: true
    warmup_epochs: 2
    weight_decay: 0.01
use_class_weighting: true
use_mixup: true
